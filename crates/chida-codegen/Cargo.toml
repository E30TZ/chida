[package]
name = "chida-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generates a complete runnable Rust full-stack app from a Chida project"

[dependencies]
chida-core = { path = "../chida-core" }
chida-db = { path = "../chida-db" }
chida-logic = { path = "../chida-logic" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

name: Desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the installers to the v2.0.0 release"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-x86_64
            bundles: "deb,appimage,rpm"
          - os: windows-latest
            target_name: windows-x86_64
            bundles: "nsis"
          - os: macos-latest
            target_name: macos-aarch64
            bundles: "dmg"
          - os: macos-15-intel
            target_name: macos-x86_64
            bundles: "dmg"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf file
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install the wasm target, Trunk and the Tauri CLI
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install trunk --locked
          cargo install tauri-cli --version "^2" --locked
      - name: Build the editor frontend
        working-directory: apps/editor
        run: trunk build --release
      - name: Generate the platform icons
        working-directory: apps/desktop/src-tauri
        run: cargo tauri icon icons/icon.png
      - name: Build the desktop app and its bundles
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: List the bundles
        shell: bash
        run: find apps/desktop/src-tauri/target/release/bundle -type f | sort
      - name: Upload the bundles as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chida-desktop-${{ matrix.target_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Attach the installers to the release
        if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TARGET="$GITHUB_REF_NAME"
          else
            TARGET="v2.0.0"
          fi
          mkdir -p release-files
          for f in $(find apps/desktop/src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.exe" -o -name "*.dmg" \)); do
            base=$(basename "$f")
            case "$base" in *.deb|*.AppImage) base=$(echo "$base" | sed 's/^Chida_/Chida-desktop_/');; esac
            cp "$f" "release-files/$base"
          done
          gh release upload "$TARGET" release-files/* --clobber

name: Demo

on:
  push:
    branches: [main]
    paths: ["apps/editor/**", "crates/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Generate template fixtures
        run: python3 tools/gen-editor-fixtures.py
      - name: Build the editor
        working-directory: apps/editor
        run: trunk build --release --public-url /chida/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/editor/dist
      - id: deployment
        uses: actions/deploy-pages@v4

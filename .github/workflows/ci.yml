name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Smoke test the CLI
        run: |
          ./target/release/chida new demo --out /tmp/chida-smoke
          ./target/release/chida info /tmp/chida-smoke/demo.chida.json
          ./target/release/chida render /tmp/chida-smoke/demo.chida.json --out /tmp/chida-smoke/render
          ./target/release/chida generate /tmp/chida-smoke/demo.chida.json --out /tmp/chida-smoke/generated-app
          test -s /tmp/chida-smoke/render/home.png
          test -s /tmp/chida-smoke/generated-app/backend/src/main.rs

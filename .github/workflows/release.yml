name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v prefix"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: CLI ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-x86_64
            bin: chida
          - os: ubuntu-24.04-arm
            target_name: linux-aarch64
            bin: chida
          - os: windows-latest
            target_name: windows-x86_64
            bin: chida.exe
          - os: macos-latest
            target_name: macos-aarch64
            bin: chida
          - os: macos-13
            target_name: macos-x86_64
            bin: chida
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "CHIDA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "CHIDA_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build the CLI
        run: cargo build --release --locked
      - name: Smoke test the binary
        shell: bash
        run: |
          ./target/release/${{ matrix.bin }} --version
          ./target/release/${{ matrix.bin }} templates
      - name: Package the tarball
        if: matrix.target_name != 'windows-x86_64'
        shell: bash
        run: |
          V="$CHIDA_VERSION"
          T="${{ matrix.target_name }}"
          mkdir -p "stage/chida-$V-$T"
          cp "target/release/${{ matrix.bin }}" "stage/chida-$V-$T/"
          cp README.md LICENSE "stage/chida-$V-$T/"
          case "$T" in
            linux-*)
              sed -e 's|^Exec=.*|Exec=chida|' -e 's|^Terminal=.*|Terminal=false|' packaging/chida.desktop > "stage/chida-$V-$T/chida.desktop"
              cat > "stage/chida-$V-$T/install.sh" <<'EOF'
          #!/bin/sh
          set -e
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/applications"
          install -m 755 "$DIR/chida" "$HOME/.local/bin/chida"
          install -m 644 "$DIR/chida.desktop" "$HOME/.local/share/applications/chida.desktop"
          echo "Installed chida to $HOME/.local/bin/chida"
          echo "Make sure $HOME/.local/bin is on your PATH."
          EOF
              chmod +x "stage/chida-$V-$T/install.sh"
              ;;
          esac
          tar -czf "chida-$V-$T.tar.gz" -C stage "chida-$V-$T"
      - name: Package the Debian package
        if: matrix.target_name == 'linux-x86_64'
        shell: bash
        run: |
          VERSION="$CHIDA_VERSION" OUTDIR=. scripts/build-deb.sh
      - name: Package the AppImage
        if: matrix.target_name == 'linux-x86_64'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          VERSION="$CHIDA_VERSION" OUTDIR=. APPDIR=AppDir FETCH_APPIMAGETOOL=1 scripts/build-appimage.sh
      - name: Package the Windows zip
        if: matrix.target_name == 'windows-x86_64'
        shell: pwsh
        run: |
          $V = $env:CHIDA_VERSION
          New-Item -ItemType Directory -Force -Path "stage/chida-$V-windows-x86_64" | Out-Null
          Copy-Item target/release/chida.exe "stage/chida-$V-windows-x86_64/"
          Copy-Item README.md, LICENSE "stage/chida-$V-windows-x86_64/"
          Compress-Archive -Path "stage/chida-$V-windows-x86_64" -DestinationPath "chida-$V-windows-x86_64.zip"
      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chida-${{ matrix.target_name }}
          path: |
            chida-*.tar.gz
            chida-*.zip
            chida-*.AppImage
            chida_*.deb
          if-no-files-found: error

  editor:
    name: Web editor zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "CHIDA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "CHIDA_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install the wasm target and Trunk
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install trunk --locked
      - name: Build the web editor
        working-directory: apps/editor
        run: trunk build --release
      - name: Package the editor zip
        run: |
          mkdir -p editor-dist
          cp -r apps/editor/dist/* editor-dist/
          cd editor-dist && zip -r "../chida-editor-$CHIDA_VERSION.zip" . && cd ..
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: chida-editor
          path: chida-editor-*.zip
          if-no-files-found: error

  fedora-rpm:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "CHIDA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "CHIDA_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi
      - name: Install build tools
        run: dnf -y install rust cargo rpm-build rpmdevtools git tar gzip
      - name: Prepare the source tarball
        shell: bash
        run: |
          V="$CHIDA_VERSION"
          sed -i "s/^Version:.*/Version:        $V/" packaging/fedora/chida.spec
          rpmdev-setuptree
          mkdir -p "/tmp/chida-$V"
          cp -r . "/tmp/chida-$V/src"
          tar -czf ~/rpmbuild/SOURCES/"chida-$V.tar.gz" -C /tmp "chida-$V"
      - name: Build and smoke test the CLI
        run: |
          cargo build --release --locked
          ./target/release/chida --version
          ./target/release/chida templates > /dev/null
      - name: Build the RPM
        shell: bash
        run: |
          rpmbuild -ba packaging/fedora/chida.spec
          mkdir -p release-out
          cp ~/rpmbuild/RPMS/*/*.rpm release-out/
          ls -la release-out
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: chida-fedora-rpm
          path: release-out/*.rpm
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [build, editor, fedora-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Collect every artifact
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: release-assets
      - name: Checksums
        run: |
          ls -la release-assets
          (cd release-assets && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS release-assets/SHA256SUMS
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body: |
            Chida ${{ github.ref_name }}

            Full list of changes: [CHANGELOG.md](https://github.com/E30TZ/chida/blob/${{ github.ref_name }}/CHANGELOG.md)

            Downloads:
            - Linux x86_64: portable tarball, AppImage (no install), .deb (Debian and Ubuntu), .rpm (Fedora and RHEL)
            - Linux aarch64: portable tarball
            - Windows x86_64: zip with chida.exe
            - macOS: tarballs for Apple Silicon and Intel
            - Any OS with a browser: the editor zip

            Verify your download against the attached SHA256SUMS file.
